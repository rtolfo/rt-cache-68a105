name: Update APSKY EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8,12,16,20,23 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate XMLTV
        run: python3 scripts/generate_epg.py

      - name: Commit updated guide
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update APSKY EPG"
          file_pattern: output/apsky-epg.xml
