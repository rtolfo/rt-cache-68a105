name: Update data

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules can be delayed or skipped. Three staggered attempts keep
    # the guide current without overlapping runs.
    - cron: "7,27,47 * * * *"

concurrency:
  group: update-epg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture Vivo guide
        run: |
          npm install --no-save playwright
          for attempt in 1 2 3; do
            if timeout 210 node scripts/fetch_vivo.js /tmp/vivo-source.json; then
              break
            fi
            rm -f /tmp/vivo-source.json
            if [ "$attempt" = "3" ]; then
              echo "Vivo guide failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

          test -s /tmp/vivo-source.json

      - name: Generate data
        env:
          VIVO_SOURCE_FILE: /tmp/vivo-source.json
        run: python3 scripts/generate_epg.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update data"
          file_pattern: data/payload.xml data/payload-claro-meuguia.xml data/payload-vivo.xml
