name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture Vivo guide
        run: |
          npm install --no-save playwright
          node scripts/fetch_vivo.js /tmp/vivo-source.json

      - name: Generate data
        env:
          VIVO_SOURCE_FILE: /tmp/vivo-source.json
        run: python3 scripts/generate_epg.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update data"
          file_pattern: data/payload.xml data/payload-claro-meuguia.xml data/payload-vivo.xml
